[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qtizen"
dynamic = ["version"]
description = "Debloat a Samsung Tizen TV, block ads, and install a clean, fast home screen, from your computer."
readme = { text = "qtizen CLI: debloat Samsung Tizen TVs, install and update the qtizen launcher, and inspect apps. See https://github.com/butukay/qtizen for installation and usage.", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vlad Lisov" }, { name = "Hamza El Alaoui" }]
requires-python = ">=3.10"
dependencies = ["websocket-client>=1.6", "cryptography>=41"]
keywords = ["samsung", "tizen", "smart-tv", "launcher", "debloat", "sdb"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "lxml>=5", "build>=1", "setuptools>=77"]

[project.scripts]
qtizen = "qtizen.cli:main"

[tool.setuptools.dynamic]
version = { attr = "qtizen.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qtizen = ["ca/*", "helpers/*.json", "helpers/*.ps1"]
